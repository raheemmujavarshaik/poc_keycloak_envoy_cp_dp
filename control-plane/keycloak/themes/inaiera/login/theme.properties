# InAiEra-branded login theme.
#
# Inherits everything from the stock `keycloak` theme (templates, i18n,
# PatternFly) and layers one stylesheet on top. Overriding CSS only — rather
# than forking the FreeMarker templates — means Keycloak upgrades keep working:
# a template fork would silently miss new fields and security fixes.
parent=keycloak
import=common/keycloak

# Order matters: our sheet must come after login.css to win on equal specificity.
styles=css/login.css css/inaiera.css

# Adds the "Forgot password?" link pointing back at the app's own recovery
# flow. Done in JS rather than by forking login.ftl, for the same reason the
# styling is CSS-only — a template fork silently rots across Keycloak upgrades.
scripts=js/inaiera.js

# Hide the realm name banner — the stylesheet draws the InAiEra brand instead.
kcHeaderClass=login-pf-header inaiera-header
