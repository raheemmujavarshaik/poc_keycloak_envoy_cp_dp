# POC Gravitino server config.
#
# IMPORTANT: this could not be live-tested against a running Gravitino
# instance in the environment this POC was built in (no Docker daemon
# available there). It's written against Gravitino's documented
# configuration conventions, but verify it against whichever exact
# `apache/gravitino:<version>` image you pull -- check that image's
# /root/gravitino/conf/gravitino.conf.template for the authoritative
# property names for that version before relying on this for anything
# beyond local experimentation.
#
# Uses an embedded H2 database for Gravitino's own metadata store (its
# bookkeeping about metalakes/catalogs/roles/grants) -- fine for a POC,
# swap for a real Postgres/MySQL backend before anything resembling
# production, per the "give Gravitino its own dedicated database" note in
# the RBAC design doc.

gravitino.server.webserver.host = 0.0.0.0
gravitino.server.webserver.httpPort = 8090
gravitino.authorization.enable = true

gravitino.entity.store = relational
gravitino.entity.store.relational = JDBCBackend
gravitino.entity.store.relational.jdbcUrl = jdbc:h2:/root/gravitino/data/gravitino_db;DB_CLOSE_DELAY=-1
gravitino.entity.store.relational.jdbcDriver = org.h2.Driver
gravitino.entity.store.relational.jdbcUser = gravitino
gravitino.entity.store.relational.jdbcPassword = gravitino

# Authorization / RBAC enforcement -- requires Gravitino >= 1.0, per the
# RBAC design doc's hard version floor. Confirm this property name against
# your pulled image; it may differ across releases.
gravitino.authorization.enable = true
