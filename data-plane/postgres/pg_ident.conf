# Maps the OIDC identity (the token's `email` claim, per
# pg_oidc_validator.authn_field=email) to a Postgres role of the SAME name.
# Our per-user PG roles are named by email (bob.scientist@acme.test), so this
# one regex line covers every user automatically -- no per-user entries.
#
# MAPNAME   SYSTEM-USERNAME (from token)   PG-USERNAME
kcmap       /^(.*)$                        \1
