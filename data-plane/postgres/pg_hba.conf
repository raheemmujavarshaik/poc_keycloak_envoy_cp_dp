# POC pg_hba.conf — authentication delegated to Keycloak via OIDC.
#
# Order matters (first match wins):
#   1. local socket: trust — used by init scripts and in-container admin.
#   2. the `postgres` superuser over TCP: scram — the Authorization Gateway
#      connects as admin (to CREATE ROLE / GRANT) with a password.
#   3. everyone else over TCP: oauth — a real user presents a Keycloak token;
#      pg_oidc_validator validates it (issuer + signature + email claim) and the
#      kcmap ident rule maps the email to the same-named per-user PG role.
#
# TYPE  DATABASE  USER      ADDRESS       METHOD
local   all       all                     trust
host    all       postgres  0.0.0.0/0     scram-sha-256
host    all       all       0.0.0.0/0     oauth  scope="openid email",issuer=https://keycloak:8443/realms/inaiera,map=kcmap
