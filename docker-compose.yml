version: "3.8"

# Local "loopback" POC stack -- everything on one Docker network, standing
# in for what will later be spread across AWS (control plane) and
# AWS/Azure/GCP (data plane, per infra/*). Two properties worth checking
# once this is up:
#   1. `docker compose ps` shows no published host port for envoy,
#      tunnel-agent, or product-mfe -- only agent-comms-service, the BFF
#      services, Keycloak, and app-shell are host-reachable.
#   2. tunnel-agent's own logs show it dialing OUT to agent-comms-service;
#      nothing ever dials into tunnel-agent.

networks:
  poc-net:
    driver: bridge

services:
  # ---------------- shared infra ----------------
  mongo:
    image: mongo:7
    networks: [poc-net]
    ports: ["27017:27017"] # host-mapped for local debugging only
    volumes: [mongo-data:/data/db]
    healthcheck:
      # Ensure dependents wait until the mongod listener actually accepts.
      # `depends_on: [mongo]` alone only waits for the container start.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    networks: [poc-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--import-realm", "--features=token-exchange"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Frontend URL stamped into tokens (iss) and browser redirects. HTTPS is
      # required in modern Chrome — Keycloak sets its session cookie with
      # SameSite=None, which Chrome silently drops over plain HTTP.
      KC_HOSTNAME: https://keycloak:8443
      KC_HOSTNAME_STRICT_HTTPS: "true"
      # Keep HTTP enabled too so Keycloak-internal broker calls
      # (Keycloak → Keycloak) can go over http://keycloak:8080 and avoid
      # having to trust the self-signed cert in Keycloak's own JVM truststore.
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/cert.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/key.pem
    volumes:
      - ./control-plane/keycloak/realm-inaiera.json:/opt/keycloak/data/import/realm-inaiera.json
      - ./control-plane/keycloak/realm-acme.json:/opt/keycloak/data/import/realm-acme.json
      - ./certs/keycloak.pem:/opt/keycloak/conf/cert.pem:ro
      - ./certs/keycloak-key.pem:/opt/keycloak/conf/key.pem:ro
    networks: [poc-net]
    # 8443 = browser-facing (HTTPS, so Chrome accepts the SameSite=None cookie).
    # 8080 = kept for internal server-side callers (BFF + broker).
    ports: ["8080:8080", "8443:8443"]
    healthcheck:
      # Keycloak 25 with HTTPS enabled also serves the management port over
      # TLS, so the raw-HTTP probe we had before fails. Fall back to a plain
      # TCP connect on 8443: once the listener is bound, Keycloak is up
      # enough for our dependents (realm import happens before bind).
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8443 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ---------------- control plane ----------------
  org-validation-service:
    build: ./control-plane/org-validation-service
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: control_plane
    networks: [poc-net]
    ports: ["4001:4001"]
    restart: on-failure
    depends_on:
      mongo:
        condition: service_healthy

  user-management-service:
    build: ./control-plane/user-management-service
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: control_plane
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: poc-dev-secret-change-me
      FRONTEND_URL: http://localhost:3000
      # Backend calls the same HTTPS URL the browser sees, so the `iss` claim
      # in returned tokens matches. NODE_EXTRA_CA_CERTS below makes Node trust
      # the self-signed cert.
      KEYCLOAK_BASE_URL: https://keycloak:8443
      NODE_EXTRA_CA_CERTS: /certs/keycloak.pem
      KEYCLOAK_REALM: inaiera
      KEYCLOAK_CLIENT_ID: bff
      KEYCLOAK_CLIENT_SECRET: bff-secret
      KEYCLOAK_REDIRECT_URI: http://localhost:4002/auth/callback
      AGENT_COMMS_URL: http://agent-comms-service:4003
      # Role Sync Worker: pushes full desired role state through the tunnel to
      # this data plane's Authorization Gateway. Must match the gateway's own
      # INTERNAL_SYNC_TOKEN below.
      DATA_PLANE_ID: dp_demo
      INTERNAL_SYNC_TOKEN: poc-internal-sync-secret
    networks: [poc-net]
    ports: ["4002:4002"]
    restart: on-failure
    volumes:
      # Node reads NODE_EXTRA_CA_CERTS at boot to trust the self-signed cert
      # so `openid-client` can talk to Keycloak over HTTPS internally.
      - ./certs/keycloak.pem:/certs/keycloak.pem:ro
    depends_on:
      mongo:    { condition: service_healthy }
      redis:    { condition: service_healthy }
      keycloak: { condition: service_healthy }

  agent-comms-service:
    build: ./control-plane/agent-comms-service
    environment:
      TUNNEL_AGENT_TOKENS: '{"dp_demo":"supersecrettoken123"}'
    networks: [poc-net]
    ports: ["4003:4003"]

  app-shell:
    build:
      context: ./control-plane/app-shell
      args:
        VITE_ORG_VALIDATION_URL: http://localhost:4001
        VITE_BFF_URL: http://localhost:4002
        VITE_DATA_PLANE_ID: dp_demo
    networks: [poc-net]
    ports: ["3000:3000"]
    depends_on: [org-validation-service, user-management-service]

  # ---------------- data plane (local stand-in for one cloud target) ----------------
  # In objectives 1/3 this whole block runs on Azure/GCP instead; only
  # BROKER_WS_URL and DATA_PLANE_ID need to change (see infra/*).
  envoy:
    build: ./data-plane/envoy
    networks: [poc-net]
    # For real traffic Envoy is reached only via tunnel-agent.
    # The port below is a **dev-only** convenience so you can poke the admin
    # panel from a browser at http://localhost:9901. Bound to 127.0.0.1 on
    # the host so only this machine can reach it, not the LAN. Remove this
    # block before running the "no inbound port" acceptance test.
    ports:
      - "127.0.0.1:9901:9901"
    depends_on:
      authorization-gateway:
        condition: service_healthy

  product-mfe:
    build: ./data-plane/product-mfe
    networks: [poc-net]
    # deliberately no "ports:" -- reached only via Envoy.

  # Sample second data-plane microservice. Demonstrates that any HTTP service
  # sitting in the data-plane network can be exposed through the same tunnel
  # + Envoy path — just add a cluster + route in envoy.yaml (already done).
  countries-service:
    build: ./data-plane/countries-service
    networks: [poc-net]
    # deliberately no "ports:" -- reached only via Envoy, same as product-mfe.

  # Data plane's own Redis -- deliberately separate from the control
  # plane's `redis` service. Each data plane is single-tenant and owns its
  # own cache; sharing the control plane's Redis here would quietly couple
  # two things the rest of this design goes out of its way to keep apart.
  dp-redis:
    image: redis:7-alpine
    networks: [poc-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Real Apache Gravitino server. If it isn't reachable, authorization-gateway
  # falls back to a mock catalog automatically -- the rest of the POC
  # (including the Catalog UI) still works either way, just says so clearly in
  # its own logs.
  gravitino:
    image: apache/gravitino:1.0.1
    # Stage the config at a non-mounted path and copy it into place at
    # startup. Gravitino's start-gravitino.sh runs rewrite_gravitino_server_config.py,
    # which does os.remove('conf/gravitino.conf') to rewrite the file in
    # place -- that fails with "Device or resource busy" if conf/gravitino.conf
    # is a bind-mounted single file (a bind mount can't be removed from inside
    # the container). Copying makes it a normal file the rewrite step can replace.
    volumes:
      - ./data-plane/gravitino/gravitino.conf:/tmp/gravitino.conf:ro
    entrypoint:
      - /bin/bash
      - -c
      - "cp /tmp/gravitino.conf /root/gravitino/conf/gravitino.conf && exec /bin/bash /root/gravitino/bin/start-gravitino.sh"
    networks: [poc-net]
    # DEV-ONLY host port so you can hit the Gravitino REST API from a browser
    # at http://localhost:8090/api/metalakes. Bound to 127.0.0.1 so only this
    # machine can reach it (same convention as Envoy's admin port below). In a
    # real data plane Gravitino has NO inbound port -- remove this block before
    # running the "no inbound port" acceptance test.
    ports:
      - "127.0.0.1:8090:8090"
    # /dev/tcp is a bash builtin; Docker's CMD-SHELL runs /bin/sh where it
    # doesn't exist, so a /dev/tcp check could never pass. curl ships in the
    # image and /api/metalakes returns 200 once the REST server is live.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/api/metalakes || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  authorization-gateway:
    build: ./data-plane/authorization-gateway
    environment:
      GRAVITINO_URL: http://gravitino:8090
      GRAVITINO_METALAKE: org_demo
      REDIS_URL: redis://dp-redis:6379
      INTERNAL_SYNC_TOKEN: poc-internal-sync-secret
    networks: [poc-net]
    restart: on-failure
    # deliberately no "ports:" -- reached only via Envoy's /authz route,
    # and via the tunnel for the control plane's role-sync pushes.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4010/healthz', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      dp-redis: { condition: service_healthy }
      gravitino: { condition: service_healthy }

  # Sample product microservice with two app domains (MLOps, Data Platform).
  # Enforces every resource action by calling the Authorization Gateway's
  # /v1/authorize -- the concrete "product service asks the gateway yes/no"
  # pattern. Reached only via Envoy's /apps route; no host port.
  platform-apps-service:
    build: ./data-plane/platform-apps-service
    environment:
      AUTH_GATEWAY_URL: http://authorization-gateway:4010
    networks: [poc-net]
    restart: on-failure
    depends_on:
      authorization-gateway: { condition: service_healthy }

  tunnel-agent:
    build: ./data-plane/tunnel-agent
    environment:
      BROKER_WS_URL: ws://agent-comms-service:4003/tunnel
      DATA_PLANE_ID: dp_demo
      TUNNEL_TOKEN: supersecrettoken123
      ENVOY_URL: http://envoy:10000
    networks: [poc-net]
    depends_on: [agent-comms-service, envoy]
    # deliberately no "ports:" -- outbound-only, this is the property the
    # whole POC exists to prove.

volumes:
  mongo-data:
